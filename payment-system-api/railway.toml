# Railway: set this service Root Directory to `payment-system-api` (monorepo).
#
# Memory:
# - Build OOM: MAVEN_OPTS below gives Maven more heap during `mvn package`.
# - Runtime OOM: DELETE the variable JAVA_TOOL_OPTIONS in Railway if you had -Xmx256m (too small for Spring + JPA + AI).
#   Or set JAVA_TOOL_OPTIONS to empty. Let -XX:MaxRAMPercentage use the container limit.
# - If it still OOMs, upgrade RAM on the Railway service (512MB is tight for this stack).
# - Optional: INSIGHTS_AI_ENABLED=false + SPRING_AI_MODEL_CHAT=none saves memory when you do not need AI.

[build]
builder = "NIXPACKS"
# bash avoids "Permission denied" when mvnw is not +x in the image (Windows checkouts)
buildCommand = "MAVEN_OPTS='-Xmx768m -XX:+UseSerialGC' bash ./mvnw -DskipTests package"

[deploy]
# Heap scales with container RAM; SerialGC is lighter on small instances
startCommand = "java -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -jar target/payment-system-api-0.0.1-SNAPSHOT.jar"

# Application
spring.application.name=payment-system-api

# HTTP
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_tracker
spring.datasource.username=postgres
spring.datasource.password=2305

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jmx.enabled=false
server.tomcat.threads.max=50

# Security / JWT
security.jwt.secret=local-dev-secret-key-do-not-use-in-production
security.jwt.expiration-minutes=60

# CORS
app.cors.allowed-origins=http://localhost:5173

# AI insights (disabled locally)
app.insights.ai-enabled=false
spring.ai.openai-sdk.api-key=
spring.ai.openai-sdk.chat.options.model=gpt-4o-mini
spring.ai.openai-sdk.chat.options.max-tokens=512
spring.ai.openai-sdk.chat.options.temperature=0.4
spring.ai.model.chat=none

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=-1
spring.main.allow-bean-definition-overriding=true

# Actuator
management.endpoints.web.exposure.include=health,info

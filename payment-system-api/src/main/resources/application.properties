# ?? Application ??????????????????????????????????????????????
spring.application.name=payment-system-api

# ?? Database ?????????????????????????????????????????????????
# In production (Railway): set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# In development: values fall back to localhost defaults
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:2305}

# ?? JPA ??????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate
# Disable SQL logging in production ? enable locally if needed
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? Security / JWT ???????????????????????????????????????????
# IMPORTANT: set a strong secret in production via environment variable
# Never hardcode secrets in this file
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ?? CORS ?????????????????????????????????????????????????????
# In production: set to your Railway frontend URL
# e.g. https://smartpayui.up.railway.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ?? AI / OpenAI ??????????????????????????????????????????????
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ?? Swagger / OpenAPI ????????????????????????????????????????
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=-1
spring.ai.openai.chat.enabled=true
spring.main.allow-bean-definition-overriding=true

# ?? Actuator ?????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
# Application
spring.application.name=payment-system-api

# HTTP (Railway / PaaS inject PORT)
server.port=${PORT:8080}

# Database
# Railway: use the Postgres plugin's DATABASE_URL (postgresql://...); it is converted to JDBC at startup.
# Local: JDBC URL below. You can also set DATABASE_URL=jdbc:postgresql://... explicitly.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:2305}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production ? enable locally if needed
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
# Smaller footprint on low-RAM hosts (e.g. Railway hobby)
spring.datasource.hikari.maximum-pool-size=5
spring.jmx.enabled=false
server.tomcat.threads.max=50

# Security / JWT
# IMPORTANT: set a strong secret in production via environment variable
# Never hardcode secrets in this file
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS
# In production: set to your Railway frontend URL
# e.g. https://smartpayui.up.railway.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AI insights (OpenAI via Spring AI). Set INSIGHTS_AI_ENABLED=true on Railway to call the API; otherwise fallback only.
app.insights.ai-enabled=${INSIGHTS_AI_ENABLED:false}
spring.ai.openai-sdk.api-key=${OPENAI_API_KEY:}
spring.ai.openai-sdk.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai-sdk.chat.options.max-tokens=${INSIGHTS_MAX_OUTPUT_TOKENS:512}
spring.ai.openai-sdk.chat.options.temperature=${INSIGHTS_TEMPERATURE:0.4}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:openai-sdk}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=-1
spring.main.allow-bean-definition-overriding=true

# Actuator
management.endpoints.web.exposure.include=health,info